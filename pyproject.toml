[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luv-finder"
version = "0.2.0"
description = "Blind spectral-line finding in the UV plane for interferometric data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joshiwa van Marrewijk", email = "joshiwa01@gmail.com" }]
keywords = ["ALMA", "interferometry", "spectral lines", "matched filter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy",
  "scipy",
  "astropy",
  "matplotlib",
  "tqdm",
  "pyyaml",
]

[project.optional-dependencies]
casa = ["casatools", "casatasks", "casadata"]
jax = ["jax", "jax-finufft"]
dev = [
  "pytest",
  "ruff",
  "pre-commit",
  "nbstripout",
  "sphinx",
  "furo",
  "nbsphinx",
  "numpydoc",
  "sphinx-copybutton",
  "ipykernel",
]

[project.scripts]
luv-mock = "luv_finder.cli.make_mock:main"
luv-find = "luv_finder.cli.find_lines:main"
luv-export = "luv_finder.cli.export_uv:main"

[project.urls]
Homepage = "https://github.com/Joshiwavm/Luv_finder"
Documentation = "https://joshiwavm.github.io/Luv_finder/"

[tool.setuptools.packages.find]
include = ["luv_finder*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs/source/tutorials"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["casa: needs casatools/casatasks and a CASA-generated mock (deselected by default)"]
addopts = "-m 'not casa'"
