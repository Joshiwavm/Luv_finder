# Source FWHM = 3x the synthesized beam. A targeted search as a user would write it:
# one position, width and size (FWHM, arcsec). tests/test_source_size.py builds the
# size_3beam mock source from this file, so template and injected source always agree.
# Beam FWHM 4.78" at 40 GHz: sqrt(BMAJ*BMIN) of the centre channel (5.12" x 4.47")
# measured on the noiseless size_point image; k beams is a FWHM of k * 4.78.
dra: 6.0
ddec: 8.0
width: 300
bmin: 14.34
bmaj: 14.34
