# Sanity grid for the line*_line* mocks, which all share the same two source
# positions and line frequencies and differ only in SNR. Use with any of
# configs/mocks/line13_line9.yaml, line10_line10.yaml, line5_line10.yaml.
#
# Positions are in MODEL convention: dra is sign-flipped relative to the mock
# preset (mock [-4.25, 23.5] -> model dra=+4.25, ddec=+23.5). See
# ../mocks/_common.md.
#
# This is a product, not a list of pairs, so it evaluates 4 points: the two
# injected sources plus two empty positions that act as controls. Their response
# should stay near the jackknife level.
dra: [4.25, 12.0]
ddec: [23.5, -4.25]
width: 300
total_flux: 1.0
