# line10_line10: two spectral-line sources, 12 m array. See _common.md.
# Verified against support/line10_line10_input.fits: positions, line frequencies and SNRs
# all reproduce.
cube_shape: [50, 256, 256]      # 50 channels x 256 x 256 pixels
cell: 0.25arcsec
dv: 100km/s                     # -> 13.34 MHz channels
freq_center: 40GHz              # band 1; cube spans 39.666 - 40.320 GHz
integration_time: 8min          # -> 0.65 mJy per channel
alma_config: configs/alma/alma.cycle10.3.cfg
ptg_file: configs/alma/ptgfile.txt
output_folder: output/ms_files
support_folder: support

sources:
  - position: [-4.25, 23.5]     # model convention: dra=+4.25, ddec=+23.5
    line: {width: 300, mean: 39.9, snr: 10}
  - position: [-12.0, -4.25]    # model convention: dra=+12.0, ddec=-4.25
    line: {width: 300, mean: 40.2, snr: 10}
