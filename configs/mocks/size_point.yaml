# Observation for tests/test_source_size.py; declared snr is the optimal S/N.
# Source position, size and width come from configs/grids/size_point.yaml:
#   luv-mock configs/mocks/size_point.yaml --grid configs/grids/size_point.yaml
cube_shape: [30, 256, 256]
cell: 0.25arcsec
dv: 100km/s
freq_center: 40GHz
integration_time: 8min
alma_config: alma.cycle13.3.cfg
output_folder: output/ms_files
support_folder: support
fits_filename: support/size_point_input.fits   # pins the project name to "size_point"

sources:
  - line: {mean: 40.0, snr: 10}
