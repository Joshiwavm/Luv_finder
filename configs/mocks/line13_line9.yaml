# Two lines at S/N 13 and 9, 12 m array, 50 channels. ~180 MB.
cube_shape: [50, 256, 256]
cell: 0.25arcsec
dv: 100km/s                 # -> 13.34 MHz channels
freq_center: 40GHz          # cube spans 39.666 - 40.320 GHz
integration_time: 8min
alma_config: alma.cycle13.3.cfg
output_folder: output/ms_files
support_folder: support

sources:
  - position: [-4.25, 23.5] # model convention: dra=+4.25, ddec=+23.5
    line: {width: 300, mean: 39.9, snr: 13}
  - position: [-12.0, -4.25]
    line: {width: 300, mean: 40.2, snr: 9}
