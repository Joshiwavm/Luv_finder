# Tiny preset for tests and quick checks: ACA, 24 channels, 1 minute. ~7 MB, ~20 s.
cube_shape: [24, 64, 64]
cell: 2arcsec               # ACA resolves ~12" at 40 GHz
dv: 100km/s
freq_center: 40GHz
integration_time: 1min
alma_config: aca.cycle13.cfg
output_folder: output/ms_files
support_folder: support
fits_filename: support/smoke_input.fits   # pins the project name to "smoke"

sources:
  - position: [-8.0, 12.0]  # model convention: dra=+8.0, ddec=+12.0
    line: {width: 300, mean: 40.0, snr: 20}
